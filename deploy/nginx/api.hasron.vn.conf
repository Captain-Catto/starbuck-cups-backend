upstream starbucks_backend {
    least_conn;

    # Add more backend instances here when you scale horizontally.
    server 127.0.0.1:8080 max_fails=3 fail_timeout=30s;
    # server 127.0.0.1:8081 max_fails=3 fail_timeout=30s;

    keepalive 64;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Edge-level rate limiting — a coarse first line of defense so flood/scan
# traffic (e.g. bots hammering /api/auth/*) is shed by Nginx before it ever
# reaches Node. The app-level limiters (rateLimitAuth, rateLimitPublicRead,
# etc.) remain the precise, per-route source of truth; this just stops a
# flood from occupying Node event-loop time at all.
limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

server {
    listen 80;
    listen [::]:80;
    server_name api.hasron.vn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.hasron.vn;

    # Replace with your Cloudflare Origin Certificate paths.
    ssl_certificate /etc/ssl/certs/cloudflare-origin.pem;
    ssl_certificate_key /etc/ssl/private/cloudflare-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Matches the Next.js proxy cap (next.config.ts proxyClientMaxBodySize) —
    # admin uploads allow up to 10 files at 10MB each. Keep these in sync;
    # if this is lower than the app-level caps, large multi-file uploads get
    # rejected here first with a generic Nginx HTML 413 instead of the
    # backend's clear per-file JSON error.
    client_max_body_size 120m;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;

    location /health {
        limit_req zone=api_general burst=10 nodelay;
        proxy_pass http://starbucks_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # Login/refresh/session — tighter than the general zone since scanners
    # commonly hammer these paths to brute-force or exhaust JWT verification.
    location /api/auth/ {
        limit_req zone=api_auth burst=10 nodelay;
        limit_conn conn_per_ip 10;
        proxy_pass http://starbucks_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 15s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /socket.io/ {
        limit_conn conn_per_ip 20;
        proxy_pass http://starbucks_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        limit_req zone=api_general burst=40 nodelay;
        limit_conn conn_per_ip 20;
        proxy_pass http://starbucks_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 15s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
